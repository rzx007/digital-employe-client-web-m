# ==============================================================================
# 数字员工客户端 - 三平台打包流水线
#
# 触发：推送形如 vX.Y.Z 的 tag（如 v0.1.5）时自动构建三平台安装包。
#       也可在 GitLab Pipelines 页面手动触发（web）。
#
# 构建机（shell executor，按 tag 调度）：
#   - win-builder  : Windows 服务器，原生打 Windows NSIS（含 backend.exe）
#   - mac-builder  : Apple Silicon Mac，原生打 macOS dmg/zip + Docker 打 Linux arm64 deb
#
# 产物统一收集到 apps/web/release/，通过 GitLab Artifacts 下载。
# ==============================================================================

stages:
  - build

variables:
  # 用国内镜像下载 Electron / electron-builder 二进制，避免拉取超时
  ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
  ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"
  # Node 大型构建（Vite 26K 模块）提高堆上限
  NODE_OPTIONS: "--max-old-space-size=8192"

# 仅在打 tag 或手动触发时跑，避免每次 push 都全平台构建
.release_rules: &release_rules
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ------------------------------------------------------------------------------
# 冒烟测试：分支 push 时跑，验证 win-builder 服务账户能看到全套工具
# （真打包只在打 tag 时触发，见下方 release_rules）
# ------------------------------------------------------------------------------
smoke:windows:
  stage: build
  tags:
    - win-builder
  rules:
    - if: '$CI_COMMIT_TAG == null'
  script:
    - node -v
    - pnpm -v
    - python3 --version
    - uv --version
    - git --version
    - echo "ALL TOOLS VISIBLE TO RUNNER"

# ------------------------------------------------------------------------------
# Windows x64（NSIS 安装包）
# ------------------------------------------------------------------------------
build:windows:
  stage: build
  tags:
    - win-builder
  <<: *release_rules
  script:
    - pnpm install --frozen-lockfile
    - pnpm build:app
  artifacts:
    name: "BobanStaff-Windows-$CI_COMMIT_TAG"
    paths:
      - apps/web/release/*.exe
      - apps/web/release/*.yml
      - apps/web/release/*.blockmap
    expire_in: 30 days

# ------------------------------------------------------------------------------
# macOS（dmg 手动分发 + zip 应用内更新源）
# ------------------------------------------------------------------------------
build:macos:
  stage: build
  tags:
    - mac-builder
  <<: *release_rules
  script:
    - pnpm install --frozen-lockfile
    - pnpm build:app
  artifacts:
    name: "BobanStaff-Mac-$CI_COMMIT_TAG"
    paths:
      - apps/web/release/*.dmg
      - apps/web/release/*.zip
      - apps/web/release/*.yml
      - apps/web/release/*.blockmap
    expire_in: 30 days

# ------------------------------------------------------------------------------
# Linux arm64 deb（在 Mac 上通过 Docker buildx 交叉构建）
# 复用现有 scripts/build-deb.sh（须 Apple Silicon + Docker Desktop）
# ------------------------------------------------------------------------------
build:linux:
  stage: build
  tags:
    - mac-builder
  <<: *release_rules
  script:
    - bash scripts/build-deb.sh
  artifacts:
    name: "BobanStaff-Linux-arm64-$CI_COMMIT_TAG"
    paths:
      - release/*.deb
    expire_in: 30 days
