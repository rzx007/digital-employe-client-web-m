# ==============================================================================
# 数字员工客户端 - 三平台打包流水线
#
# 触发：推送形如 vX.Y.Z 的 tag（如 v0.1.5）时自动构建三平台安装包。
#       分支 push 时只跑 smoke 冒烟测试，不触发真打包。
#
# 构建机（shell executor，按 tag 调度）：
#   - win-builder  : Windows 服务器，原生打 Windows NSIS（含 backend.exe）
#   - mac-builder  : Apple Silicon Mac，原生打 macOS dmg/zip + Docker 打 Linux arm64 deb
#
# 注：本仓库 GitLab 为旧版本，使用 only/except 语法（不支持 rules）。
# ==============================================================================

stages:
  - build

variables:
  # ---------- 国内镜像（npmmirror，与根目录 .npmrc 一致）----------
  NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"
  ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
  ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"
  UV_INDEX_URL: "https://npmmirror.com/mirror/pypi/simple"
  UV_PYTHON_INSTALL_MIRROR: "https://npmmirror.com/mirror/python"
  PIP_INDEX_URL: "https://npmmirror.com/mirror/pypi/simple"
  # Node 大型构建（Vite 26K 模块）提高堆上限
  NODE_OPTIONS: "--max-old-space-size=8192"
  # Windows shell 构建：Python/uv 子进程输出统一 UTF-8
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  # uv 拉 PyPI：拉长超时，避免 anthropic 等大包下载失败
  UV_HTTP_TIMEOUT: "300"
  UV_HTTP_RETRIES: "5"
  UV_PYTHON: "3.11"

# 版本 tag（vX.Y.Z）才触发真打包
.release_refs: &release_refs
  - /^v\d+\.\d+\.\d+/

# Windows：pnpm 嵌套 node_modules 路径极深，git clean 会触发 MAX_PATH 失败。
# 跳过 get_sources 的 git clean，改由 windows-prepare.ps1 用 robocopy 清理。
.win_ci: &win_ci
  variables:
    GIT_CLEAN_FLAGS: ""
  before_script:
    - pwsh -NoProfile -File scripts/ci/windows-prepare.ps1

# ------------------------------------------------------------------------------
# 冒烟测试：分支 push 时跑，验证 win-builder 服务账户能看到全套工具
# ------------------------------------------------------------------------------
smoke:windows:
  <<: *win_ci
  stage: build
  tags:
    - win-builder
  except:
    - tags
  script:
    - node -v
    - pnpm -v
    - python3 --version
    - uv --version
    - git --version
    - echo "ALL TOOLS VISIBLE TO RUNNER"

# ------------------------------------------------------------------------------
# Windows x64（NSIS 安装包）
# ------------------------------------------------------------------------------
build:windows:
  <<: *win_ci
  stage: build
  tags:
    - win-builder
  only: *release_refs
  script:
    - pnpm install --frozen-lockfile --config.node-linker=hoisted --registry=https://registry.npmmirror.com
    - pnpm build:app
  artifacts:
    name: "BobanStaff-Windows-$CI_COMMIT_TAG"
    paths:
      - apps/web/release/*.exe
      - apps/web/release/*.yml
      - apps/web/release/*.blockmap
    expire_in: 30 days

# ------------------------------------------------------------------------------
# macOS（dmg 手动分发 + zip 应用内更新源）
# ------------------------------------------------------------------------------
build:macos:
  stage: build
  tags:
    - mac-builder
  only: *release_refs
  script:
    - pnpm install --frozen-lockfile --registry=https://registry.npmmirror.com
    - pnpm build:app
  artifacts:
    name: "BobanStaff-Mac-$CI_COMMIT_TAG"
    paths:
      - apps/web/release/*.dmg
      - apps/web/release/*.zip
      - apps/web/release/*.yml
      - apps/web/release/*.blockmap
    expire_in: 30 days

# ------------------------------------------------------------------------------
# Linux arm64 deb（在 Mac 上通过 Docker buildx 交叉构建）
# 复用现有 scripts/build-deb.sh（须 Apple Silicon + Docker Desktop）
# ------------------------------------------------------------------------------
build:linux:
  stage: build
  tags:
    - mac-builder
  only: *release_refs
  script:
    - bash scripts/build-deb.sh
  artifacts:
    name: "BobanStaff-Linux-arm64-$CI_COMMIT_TAG"
    paths:
      - release/*.deb
    expire_in: 30 days
