# ==============================================================================
# 数字员工客户端 - 打包流水线
#
# Windows（win-builder = yaoji 账户下的 GitLab Runner，shell executor）：
#   首次部署请用管理员执行 scripts/ci/setup-win-runner-yaoji.ps1
#   将 Runner 服务从 systemprofile 改为 yaoji 运行。
#   CI job 即「远程下发指令」，实际执行 scripts/ci/build-windows.ps1。
#   默认保留 .venv / node_modules，比旧 CI 冷启动快。
#   - 推 vX.Y.Z tag → build:windows 自动触发
#   - 分支 Pipeline → build:windows:manual 网页手动点 Play
#   RDP 本地也可直接跑同一脚本。
#
# macOS / Linux：推送 tag 时由 mac-builder CI 自动构建。
# 分支 push：Windows 无自动 job（smoke 冒烟已关；需打包用 build:windows:manual 手动 Play）。
#
# 注：本仓库 GitLab 为旧版本，使用 only/except 语法（不支持 rules）。
# ==============================================================================

stages:
  - build

variables:
  # ---------- 国内镜像（npmmirror，与根目录 .npmrc 一致）----------
  NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"
  ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
  # dmg-builder 等须走 electron-builder-binaries 路径（非 electron/）；26.11.1+ 才与 ELECTRON_MIRROR 共存
  ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"
  UV_INDEX_URL: "https://mirrors.aliyun.com/pypi/simple/"
  UV_EXTRA_INDEX_URL: "https://npmmirror.com/mirror/pypi/simple https://pypi.org/simple"
  # yaoji 账户：Python / uv 缓存 / 工具链 PATH
  UV_PYTHON: "C:/Users/yaoji/AppData/Local/Programs/Python/Python311/python.exe"
  UV_CACHE_DIR: "C:/Users/yaoji/AppData/Local/uv-cache"
  UV_CONCURRENT_DOWNLOADS: "16"
  PIP_INDEX_URL: "https://mirrors.aliyun.com/pypi/simple/"
  # Node 大型构建（Vite 26K 模块）提高堆上限
  NODE_OPTIONS: "--max-old-space-size=8192"
  # Windows shell 构建：Python/uv 子进程输出统一 UTF-8
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  # uv 拉 PyPI：拉长超时，避免 anthropic 等大包下载失败
  UV_HTTP_TIMEOUT: "300"
  UV_HTTP_RETRIES: "5"
  # 32 位 makensis 从 systemprofile 下的 .cache 启动会因 WOW64 重定向报 3221225781。
  # 只把 electron-builder 缓存移出 systemprofile，不覆盖 LOCALAPPDATA
  # （否则会搬走 pnpm 的 store，导致冷装）。
  ELECTRON_BUILDER_CACHE: "C:/GitLab-Runner/localappdata/electron-builder/Cache"
  # UV_PYTHON / UV_CACHE_DIR 见全局 variables（yaoji 账户）
  FEISHU_BITABLE_WIKI_NODE: "Zc3XwAhsMiJPUEk7IimcHMfKnoc"
  FEISHU_BITABLE_TABLE_ID: "tblhM5KRRT2i8YsP"
  FEISHU_BITABLE_URL: "https://scnj8otdvysf.feishu.cn/wiki/Zc3XwAhsMiJPUEk7IimcHMfKnoc?table=tblhM5KRRT2i8YsP&view=vewYirQnN3"

# 版本 tag（vX.Y.Z）才触发真打包
.release_refs: &release_refs
  - /^v\d+\.\d+\.\d+/

# Windows smoke / build：yaoji 账户 Runner（见 setup-win-runner-yaoji.ps1）
.win_smoke: &win_smoke
  variables:
    GIT_CLEAN_FLAGS: ""
  before_script:
    - pwsh -NoProfile -File scripts/ci/windows-prepare.ps1 -SkipClean

# ------------------------------------------------------------------------------
# 冒烟测试：已关闭（job 名前加 . 变隐藏 job，不再运行）。
# 真打包已跑通，分支 push 不再需要冒烟。如需重开：去掉下面 job 名前的点。
# ------------------------------------------------------------------------------
.smoke:windows:
  <<: *win_smoke
  stage: build
  tags:
    - win-builder
  except:
    - tags
  script:
    - echo "CI user=$env:USERNAME"
    - node -v
    - pnpm -v
    - py -3.11-64 -c "import sys,platform; print(sys.executable); print(platform.architecture()); assert sys.maxsize > 2**32"
    - uv --version
    - git --version
    - echo "ALL TOOLS VISIBLE TO RUNNER"

# Windows 打包：CI 在那台机器上跑 build-windows.ps1（不删缓存）
.win_build: &win_build
  variables:
    GIT_CLEAN_FLAGS: ""

# ------------------------------------------------------------------------------
# Windows x64：推 tag 自动打包（快路径，保留 .venv）
# ------------------------------------------------------------------------------
build:windows:
  <<: *win_build
  stage: build
  tags:
    - win-builder
  only: *release_refs
  script:
    - pwsh -NoProfile -File scripts/ci/build-windows.ps1 -Ref $env:CI_COMMIT_TAG -SkipGitSync
  # exe 走飞书分发(publish-feishu.py)，不塞 GitLab 产物(老服务器 413 上限)。
  # 仅留体积极小的更新清单/blockmap 作轻量记录。
  artifacts:
    name: "BobanStaff-Windows-$CI_COMMIT_TAG"
    paths:
      - apps/web/release/*.yml
      - apps/web/release/*.blockmap
    expire_in: 30 days

# ------------------------------------------------------------------------------
# Windows x64：分支上手动触发（Pipeline 页点 Play）
# ------------------------------------------------------------------------------
build:windows:manual:
  <<: *win_build
  stage: build
  tags:
    - win-builder
  when: manual
  except:
    - tags
  script:
    - pwsh -NoProfile -File scripts/ci/build-windows.ps1 -Ref $env:CI_COMMIT_REF_NAME -SkipGitSync
  # exe 走飞书分发，不塞 GitLab 产物(老服务器 413 上限)。
  artifacts:
    name: "BobanStaff-Windows-$CI_COMMIT_REF_NAME"
    paths:
      - apps/web/release/*.yml
      - apps/web/release/*.blockmap
    expire_in: 7 days

# ------------------------------------------------------------------------------
# 仅测试飞书推送：复用 release 目录里已打好的安装包跑 publish-feishu.py，不重新打包。
# 手动触发（需上次 build:windows:manual 留下的 exe 还在工作区，GIT_CLEAN_FLAGS="" 会保留）。
# ------------------------------------------------------------------------------
publish:feishu:
  <<: *win_build
  stage: build
  tags:
    - win-builder
  when: manual
  except:
    - tags
  script:
    - C:/Users/yaoji/AppData/Local/Programs/Python/Python311/python.exe scripts/ci/publish-feishu.py

# ------------------------------------------------------------------------------
# 冒烟测试（Mac）：已关闭（job 名前加 . 变隐藏 job）。mac-builder 已验证就绪。
# 如需重开排查工具链：去掉下面 job 名前的点。
# ------------------------------------------------------------------------------
.smoke:mac:
  stage: build
  tags:
    - mac-builder
  except:
    - tags
  script:
    - whoami
    - 'echo "PATH=$PATH"'
    - node -v
    - pnpm -v
    - python3 --version
    - uv --version
    - git --version
    - docker --version
    - docker buildx ls
    - echo "ALL MAC TOOLS VISIBLE"

# ------------------------------------------------------------------------------
# Linux arm64 deb（在 Mac 上通过 Docker buildx 交叉构建）
# 复用现有 scripts/build-deb.sh（须 Apple Silicon + Docker Desktop）
# ------------------------------------------------------------------------------
build:linux:
  stage: build
  tags:
    - mac-builder
  only: *release_refs
  script:
    - bash scripts/build-deb.sh
    # deb 走飞书分发(publish-feishu.py)，不塞 GitLab 产物(老服务器 413 上限)。
    # 显式传路径，避免误推 apps/web/release 里 macOS 上次留下的 dmg/zip。
    - python3 scripts/ci/publish-feishu.py release/BobanStaff-Linux-arm64-${CI_COMMIT_TAG#v}.deb

# ------------------------------------------------------------------------------
# macOS（dmg 手动分发 + zip 应用内更新源）
# 需 electron-builder ≥ 26.11.1：与 ELECTRON_MIRROR 同时使用时才会正确走
# ELECTRON_BUILDER_BINARIES_MIRROR（npmmirror），否则 dmg-builder 404。
# ------------------------------------------------------------------------------
build:macos:
  stage: build
  tags:
    - mac-builder
  only: *release_refs
  script:
    - pnpm install --frozen-lockfile --registry=https://registry.npmmirror.com
    - pnpm build:app
  artifacts:
    name: "BobanStaff-Mac-$CI_COMMIT_TAG"
    paths:
      - apps/web/release/*.dmg
      - apps/web/release/*.zip
      - apps/web/release/*.yml
      - apps/web/release/*.blockmap
    expire_in: 30 days
