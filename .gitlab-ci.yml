# ==============================================================================
# 数字员工客户端 - 打包流水线
#
# Windows（win-builder = 那台 Windows 服务器，shell executor）：
#   CI job 即「远程下发指令」，实际执行 scripts/ci/build-windows.ps1。
#   默认保留 .venv / node_modules，比旧 CI 冷启动快。
#   - 推 vX.Y.Z tag → build:windows 自动触发
#   - 分支 Pipeline → build:windows:manual 网页手动点 Play
#   RDP 本地也可直接跑同一脚本。
#
# macOS / Linux：推送 tag 时由 mac-builder CI 自动构建。
# 分支 push：Windows 只跑 smoke 冒烟（验证 Runner 工具链）。
#
# 注：本仓库 GitLab 为旧版本，使用 only/except 语法（不支持 rules）。
# ==============================================================================

stages:
  - build

variables:
  # ---------- 国内镜像（npmmirror，与根目录 .npmrc 一致）----------
  NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"
  ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
  ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"
  UV_INDEX_URL: "https://npmmirror.com/mirror/pypi/simple"
  UV_EXTRA_INDEX_URL: "https://pypi.org/simple"
  PIP_INDEX_URL: "https://npmmirror.com/mirror/pypi/simple"
  # Node 大型构建（Vite 26K 模块）提高堆上限
  NODE_OPTIONS: "--max-old-space-size=8192"
  # Windows shell 构建：Python/uv 子进程输出统一 UTF-8
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  # uv 拉 PyPI：拉长超时，避免 anthropic 等大包下载失败
  UV_HTTP_TIMEOUT: "300"
  UV_HTTP_RETRIES: "5"
  # UV_PYTHON 固定为 win-builder 上 64 位 Python 3.11 绝对路径（Runner 服务账户无 py 启动器）
  FEISHU_BITABLE_WIKI_NODE: "Zc3XwAhsMiJPUEk7IimcHMfKnoc"
  FEISHU_BITABLE_TABLE_ID: "tblhM5KRRT2i8YsP"
  FEISHU_BITABLE_URL: "https://scnj8otdvysf.feishu.cn/wiki/Zc3XwAhsMiJPUEk7IimcHMfKnoc?table=tblhM5KRRT2i8YsP&view=vewYirQnN3"

# 版本 tag（vX.Y.Z）才触发真打包
.release_refs: &release_refs
  - /^v\d+\.\d+\.\d+/

# Windows smoke：只检测工具链，不删 .venv / node_modules（留给 build-windows.ps1 复用）
.win_smoke: &win_smoke
  variables:
    GIT_CLEAN_FLAGS: ""
    UV_PYTHON: "C:/Users/yaoji/AppData/Local/Programs/Python/Python311/python.exe"
  before_script:
    - pwsh -NoProfile -File scripts/ci/windows-prepare.ps1 -SkipClean

# ------------------------------------------------------------------------------
# 冒烟测试：分支 push 时跑，验证 win-builder 服务账户能看到全套工具
# ------------------------------------------------------------------------------
smoke:windows:
  <<: *win_smoke
  stage: build
  tags:
    - win-builder
  except:
    - tags
  script:
    - node -v
    - pnpm -v
    # Runner 以 systemprofile 运行，py 启动器不可用；打包实际用 UV_PYTHON 绝对路径
    - '& $env:UV_PYTHON -c "import sys,platform; print(sys.executable); print(platform.architecture()); assert sys.maxsize > 2**32"'
    - uv --version
    - git --version
    - echo "ALL TOOLS VISIBLE TO RUNNER"

# Windows 打包：CI 在那台机器上跑 build-windows.ps1（不删缓存）
.win_build: &win_build
  variables:
    GIT_CLEAN_FLAGS: ""
    UV_PYTHON: "C:/Users/yaoji/AppData/Local/Programs/Python/Python311/python.exe"

# ------------------------------------------------------------------------------
# Windows x64：推 tag 自动打包（快路径，保留 .venv）
# ------------------------------------------------------------------------------
build:windows:
  <<: *win_build
  stage: build
  tags:
    - win-builder
  only: *release_refs
  script:
    - pwsh -NoProfile -File scripts/ci/build-windows.ps1 -Ref $env:CI_COMMIT_TAG -SkipGitSync
  artifacts:
    name: "BobanStaff-Windows-$CI_COMMIT_TAG"
    paths:
      - apps/web/release/*.exe
      - apps/web/release/*.yml
      - apps/web/release/*.blockmap
    expire_in: 30 days

# ------------------------------------------------------------------------------
# Windows x64：分支上手动触发（Pipeline 页点 Play）
# ------------------------------------------------------------------------------
build:windows:manual:
  <<: *win_build
  stage: build
  tags:
    - win-builder
  when: manual
  except:
    - tags
  script:
    - pwsh -NoProfile -File scripts/ci/build-windows.ps1 -Ref $env:CI_COMMIT_REF_NAME -SkipGitSync
  artifacts:
    name: "BobanStaff-Windows-$CI_COMMIT_REF_NAME"
    paths:
      - apps/web/release/*.exe
      - apps/web/release/*.yml
      - apps/web/release/*.blockmap
    expire_in: 7 days

# ------------------------------------------------------------------------------
# macOS（dmg 手动分发 + zip 应用内更新源）
# ------------------------------------------------------------------------------
build:macos:
  stage: build
  tags:
    - mac-builder
  only: *release_refs
  script:
    - pnpm install --frozen-lockfile --registry=https://registry.npmmirror.com
    - pnpm build:app
  artifacts:
    name: "BobanStaff-Mac-$CI_COMMIT_TAG"
    paths:
      - apps/web/release/*.dmg
      - apps/web/release/*.zip
      - apps/web/release/*.yml
      - apps/web/release/*.blockmap
    expire_in: 30 days

# ------------------------------------------------------------------------------
# Linux arm64 deb（在 Mac 上通过 Docker buildx 交叉构建）
# 复用现有 scripts/build-deb.sh（须 Apple Silicon + Docker Desktop）
# ------------------------------------------------------------------------------
build:linux:
  stage: build
  tags:
    - mac-builder
  only: *release_refs
  script:
    - bash scripts/build-deb.sh
  artifacts:
    name: "BobanStaff-Linux-arm64-$CI_COMMIT_TAG"
    paths:
      - release/*.deb
    expire_in: 30 days
