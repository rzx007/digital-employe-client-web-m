[project]
name = "digital-employee-activation-core"
version = "0.1.0"
description = "Digital Employee offline activation license signing and verification"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "cryptography>=42.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/activation_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
