<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Extension network demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 1.5rem;
        max-width: 640px;
      }
      pre {
        background: #f4f4f5;
        padding: 0.75rem;
        overflow: auto;
        font-size: 12px;
      }
      button {
        margin-right: 0.5rem;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <h1>插件 UI 出网（webRequest + allowlist）</h1>
    <p>allowlist: <code>jsonplaceholder.typicode.com</code></p>
    <button id="fetch-ok">合法请求（原生 fetch）</button>
    <button id="fetch-block">被拦截（evil.com）</button>
    <pre id="log"></pre>
    <script>
      const logEl = document.getElementById("log")
      function log(value) {
        logEl.textContent =
          typeof value === "string" ? value : JSON.stringify(value, null, 2)
      }

      async function runFetch(url) {
        const res = await fetch(url)
        const body = await res.json()
        log({ ok: res.ok, status: res.status, body })
      }

      document.getElementById("fetch-ok").addEventListener("click", () => {
        void runFetch(
          "https://jsonplaceholder.typicode.com/todos/1",
        ).catch((err) => log(String(err)))
      })

      document.getElementById("fetch-block").addEventListener("click", () => {
        void runFetch("https://evil.com/").catch((err) => log(String(err)))
      })

      void window.extension?.getContext().then((ctx) => log({ ctx }))
    </script>
  </body>
</html>
