[project]
name = "digital-employee-license-issuer"
version = "0.1.0"
description = "Digital Employee offline activation license issuer (admin CLI)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "digital-employee-activation-core",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
de-license = "license_issuer.__main__:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/license_issuer"]

[tool.uv.sources]
digital-employee-activation-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
