[project]
name = "digital-employee-license-issuer-server"
version = "0.1.0"
description = "Digital Employee 飞书签发 HTTP 服务（内置私钥，独立部署）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "digital-employee-license-issuer",
    "digital-employee-activation-core",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/license_issuer_server"]

[tool.uv.sources]
digital-employee-license-issuer = { workspace = true }
digital-employee-activation-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
