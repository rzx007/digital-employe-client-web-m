[project]
name = "digital-employee-workspace"
version = "0.0.0"
description = "Monorepo uv workspace root (Python apps)"
requires-python = ">=3.11"
dependencies = [
    "digital-employee-client",
    "digital-employee-activation-core",
    "digital-employee-license-issuer",
]

[tool.uv.workspace]
members = [
    "apps/server",
    "packages/activation-core",
    "apps/license-issuer",
]

# 国内构建默认走 npmmirror；PyPI 作备用，避免 build-system（hatchling/setuptools）解析失败
[tool.uv]
index-url = "https://npmmirror.com/mirror/pypi/simple"
extra-index-url = ["https://pypi.org/simple"]
# CI/打包固定 Python 3.11，避免 lock 中 3.13 split 在 sync 时重新解析失败
environments = ["python_version == '3.11'"]

[tool.uv.sources]
digital-employee-client = { workspace = true }
digital-employee-activation-core = { workspace = true }
digital-employee-license-issuer = { workspace = true }
